research:
  question: >-
    How much of an algorithm's suitability for real-time, low-power deployment
    is determined not only by the algorithm itself, but also by the
    architectural choices made in translating it into hardware.
  text: >-
    I am interested in VLSI DSP architectures and ASIC design, where throughput,
    power, and area constraints are treated as first-order design inputs rather
    than downstream implementation details.

