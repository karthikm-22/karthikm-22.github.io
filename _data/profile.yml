# About section at the bottom of the home page
about:
  - >-
    I am an Electronics and VLSI Design student at Dhirubhai Ambani University
    (formerly DA-IICT), India. I design integrated circuits and hardware
    architectures for signal processing, with interests in digital IC design,
    signal conditioning front-ends, digital signal processing, and a growing
    focus on biomedical ICs.
  - >-
    I aspire to pursue advanced research through graduate and doctoral studies,
    contributing to the development of efficient hardware solutions for
    real-world applications.

