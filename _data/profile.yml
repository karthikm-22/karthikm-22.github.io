research:
  question: >-
    How can application-specific knowledge guide architectural and
    circuit-level decisions to achieve efficient hardware implementation under
    resource constraints?
  text: >-
    I am currently working on building such energy-efficient solutions,
    particularly for life-improving integrated biomedical acquisition
    and processing systems.

