# About section at the bottom of the home page
about:
  - >-
    I am Karthik Maddimsetti. I am an Electronics and VLSI Design Engineering
    student at Dhirubhai Ambani University (Formerly, DA-IICT), passionate about
    designing efficient integrated circuits and hardware architectures.
  - >-
    My interests span digital IC design, VLSI implementation, and DSP hardware,
    with a growing focus on biomedical signal acquisition and processing. Through
    academic projects and research experience, I enjoy exploring the intersection
    of circuit design, signal processing, and real-world applications.

